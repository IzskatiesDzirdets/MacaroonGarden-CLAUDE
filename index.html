  <!-- React un 3D Loģika -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ADMIN_CREDENTIALS = {
      username: "admin",
      password: "password123"
    };

    const MOODS = [
      { id: 'romantic', name: 'Romantiskā', color: '#E0A9AF', bgClass: 'bg-[#FDF0F0]' },
      { id: 'fresh', name: 'Svaigā', color: '#A8E6CF', bgClass: 'bg-[#E8F8F5]' },
      { id: 'luxury', name: 'Luksuss', color: '#D4AF37', bgClass: 'bg-[#FAF4E8]' },
      { id: 'berry', name: 'Ogu', color: '#D980FA', bgClass: 'bg-[#F8EFBA]' }
    ];

    const FLAVORS = [
      { id: 'pistachio', name: 'Pistāciju', desc: 'Sicīlijas pistāciju krēms ar maigu riekstu garšu', color: 'bg-emerald-200 border-emerald-400 text-emerald-900', circleBg: 'bg-emerald-400', price: 1.80 },
      { id: 'raspberry', name: 'Avenes & Šokolāde', desc: 'Svaigu aveņu pildījums ar tumšo Beļģijas šokolādi', color: 'bg-rose-200 border-rose-400 text-rose-900', circleBg: 'bg-rose-400', price: 1.80 },
      { id: 'caramel', name: 'Sāļā Karamele', desc: 'Pašgatavota sviesta karamele ar jūras sāls kristāliem', color: 'bg-amber-200 border-amber-400 text-amber-900', circleBg: 'bg-amber-400', price: 1.80 },
      { id: 'vanilla', name: 'Madagaskaras Vanilija', desc: 'Klasisks vaniļas pildījums ar īstām vaniļas pākstīm', color: 'bg-orange-100 border-orange-300 text-orange-900', circleBg: 'bg-orange-200', price: 1.80 },
      { id: 'lemon', name: 'Citruss & Citrons', desc: 'Svaigs un atspirdzinošs citrona krēms', color: 'bg-yellow-200 border-yellow-400 text-yellow-900', circleBg: 'bg-yellow-300', price: 1.80 },
      { id: 'blueberry', name: 'Mellenes & Lavanda', desc: 'Meža melleņu pildījums ar vieglu lavandas noti', color: 'bg-purple-200 border-purple-400 text-purple-900', circleBg: 'bg-purple-300', price: 1.80 }
    ];

    const BOX_SIZES = [
      { size: 6, label: 'Kaste 6 gab.', discount: 0, gridCols: 'grid-cols-3 sm:grid-cols-6' },
      { size: 12, label: 'Kaste 12 gab.', discount: 0.05, gridCols: 'grid-cols-4 sm:grid-cols-6' },
      { size: 24, label: 'Kaste 24 gab.', discount: 0.10, gridCols: 'grid-cols-6 sm:grid-cols-8' }
    ];

    // Real macaron.glb loader
    function Macaron3D() {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;

        const width = containerRef.current.clientWidth;
        const height = containerRef.current.clientHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        containerRef.current.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        let modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Ielādējam tavu macaron.glb failu
        const loader = new THREE.GLTFLoader();
        loader.load('macaron.glb', (gltf) => {
          const model = gltf.scene;
          
          // Centram un mērogojam modeli
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          model.position.sub(center);

          modelGroup.add(model);
        }, undefined, (error) => {
          console.error("Kļūda ielādējot macaron.glb:", error);
        });

        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          modelGroup.rotation.y += 0.008;
          modelGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.1;
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!containerRef.current) return;
          const w = containerRef.current.clientWidth;
          const h = containerRef.current.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          if (containerRef.current && renderer.domElement) {
            containerRef.current.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div ref={containerRef} className="w-full h-full min-h-[350px]" />;
    }

    function App() {
      const [activeMood, setActiveMood] = useState(MOODS[0]);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedBoxSize, setSelectedBoxSize] = useState(12);
      const [boxItems, setBoxItems] = useState([]);
      const [formData, setFormData] = useState({ name: '', phone: '', email: '', date: '', notes: '' });
      const [showModal, setShowModal] = useState(false);

      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      const addItem = (flavor) => {
        if (boxItems.length >= selectedBoxSize) return;
        setBoxItems(prev => [...prev, flavor]);
      };

      const removeItemAtIndex = (index) => {
        setBoxItems(prev => prev.filter((_, i) => i !== index));
      };

      const removeLastItemOfId = (id) => {
        const lastIndex = boxItems.map(item => item.id).lastIndexOf(id);
        if (lastIndex !== -1) {
          removeItemAtIndex(lastIndex);
        }
      };

      const getItemCount = (id) => boxItems.filter(item => item.id === id).length;

      const calculateTotal = () => {
        const rawTotal = boxItems.reduce((sum, item) => sum + item.price, 0);
        const currentBox = BOX_SIZES.find(b => b.size === selectedBoxSize);
        const discount = currentBox ? currentBox.discount : 0;
        return (rawTotal * (1 - discount)).toFixed(2);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (boxItems.length === 0) {
          alert('Lūdzu, pievienojiet vismaz vienu makarūnu kastei!');
          return;
        }
        setShowModal(true);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (loginUser === ADMIN_CREDENTIALS.username && loginPass === ADMIN_CREDENTIALS.password) {
          setLoginError('');
          window.location.href = 'admin.html';
        } else {
          setLoginError('Nepareizs lietotājvārds vai parole!');
        }
      };

      const currentBoxConfig = BOX_SIZES.find(b => b.size === selectedBoxSize);

      return (
        <div className={`transition-colors duration-500 ${activeMood.bgClass}`}>
          
          <header className="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-rose-100">
            <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
              <a href="#" className="text-2xl font-serif font-bold tracking-wide text-brand-dark">
                Macaroon <span className="text-brand-accent italic">Garden</span>
              </a>

              <nav className="hidden md:flex gap-8 text-sm font-medium items-center">
                <a href="#hero" className="hover:text-brand-accent transition-colors">3D Makarūns</a>
                <a href="#game-section" className="hover:text-brand-accent transition-colors">Spēle</a>
                <a href="#flavors" className="hover:text-brand-accent transition-colors">Garšas</a>
                <a href="#builder" className="hover:text-brand-accent transition-colors">Kastes salicējs</a>
                <a href="#order" className="hover:text-brand-accent transition-colors">Pasūtīt</a>
              </nav>

              <div className="hidden md:flex items-center gap-3">
                <button 
                  onClick={() => setShowLoginModal(true)}
                  className="text-xs font-semibold px-3 py-2 text-gray-500 hover:text-brand-dark transition-colors"
                >
                  Admin Ieiet
                </button>
                <a href="#builder" className="bg-brand-dark text-white px-5 py-2.5 rounded-full text-sm font-medium hover:bg-brand-accent transition-colors shadow-sm">
                  Salikt kasti ({boxItems.length}/{selectedBoxSize})
                </a>
              </div>

              <button 
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                className="md:hidden p-2 text-brand-dark focus:outline-none"
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  {mobileMenuOpen ? (
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                  ) : (
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                  )}
                </svg>
              </button>
            </div>

            {mobileMenuOpen && (
              <div className="md:hidden bg-white border-b border-rose-100 px-4 pt-2 pb-6 space-y-3 animate-fade-in">
                <a href="#hero" onClick={() => setMobileMenuOpen(false)} className="block py-2 text-sm font-medium">3D Makarūns</a>
                <a href="#game-section" onClick={() => setMobileMenuOpen(false)} className="block py-2 text-sm font-medium">Spēle</a>
                <a href="#flavors" onClick={() => setMobileMenuOpen(false)} className="block py-2 text-sm font-medium">Garšas</a>
                <a href="#builder" onClick={() => setMobileMenuOpen(false)} className="block py-2 text-sm font-medium">Kastes salicējs</a>
                <a href="#order" onClick={() => setMobileMenuOpen(false)} className="block py-2 text-sm font-medium">Pasūtīt</a>
                <button 
                  onClick={() => { setMobileMenuOpen(false); setShowLoginModal(true); }} 
                  className="block w-full text-left py-2 text-sm font-bold text-brand-accent"
                >
                  Admin Ieiet
                </button>
              </div>
            )}
          </header>

          {/* SĀKUMA SEKCIJA: POGAS PAŠĀ AUGŠĀ */}
          <section id="hero" className="pt-8 pb-16 md:py-16 max-w-6xl mx-auto px-4 space-y-8">
            
            {/* NOSKAŅAS IZVĒLES POGAS PAŠĀ SĀKUMĀ */}
            <div className="bg-white/80 backdrop-blur-md p-4 md:p-6 rounded-2xl border border-white/80 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
              <span className="text-sm font-bold uppercase tracking-wider text-brand-dark">
                Izvēlies lapas noskaņu:
              </span>
              <div className="flex flex-wrap gap-3">
                {MOODS.map(mood => (
                  <button
                    key={mood.id}
                    onClick={() => setActiveMood(mood)}
                    className={`px-6 py-2.5 rounded-full text-sm font-bold transition-all shadow-sm ${
                      activeMood.id === mood.id 
                        ? 'bg-brand-dark text-white shadow-md scale-105' 
                        : 'bg-white text-gray-700 hover:bg-rose-50'
                    }`}
                  >
                    {mood.name}
                  </button>
                ))}
              </div>
            </div>

            <div className="grid md:grid-cols-2 gap-12 items-center">
              <div className="space-y-6">
                <h1 className="text-5xl md:text-6xl font-bold leading-tight">
                  Izbaudiet īstu <span className="italic text-brand-accent">garšas mākslu</span>
                </h1>
                <p className="text-gray-600 text-lg">
                  Katra kaste tiek veidota no augstākās kvalitātes sastāvdaļām ar īpašu rūpību un mīlestību.
                </p>
              </div>

              <div className="bg-white/60 backdrop-blur-md border border-white/80 rounded-3xl p-6 shadow-xl relative flex flex-col items-center justify-center">
                <Macaron3D />
                <p className="text-xs text-gray-400 mt-2">Interaktīvs macaron.glb 3D modelis</p>
              </div>
            </div>
          </section>

          <section id="game-section" className="py-12 max-w-6xl mx-auto px-4">
            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-rose-100 space-y-6">
              <div className="text-center space-y-2">
                <h2 className="text-3xl font-bold">Makarūnu Spēle</h2>
                <p className="text-gray-600 text-sm">Spēlējiet mūsu spēli tieši šeit un gūstiet patīkamas emocijas!</p>
              </div>

              <div className="w-full h-[450px] md:h-[550px] rounded-2xl overflow-hidden border border-gray-100 shadow-inner bg-gray-50">
                <iframe 
                  src="game.html" 
                  className="w-full h-full border-0"
                  title="Macaroon Game"
                  allow="autoplay"
                ></iframe>
              </div>
            </div>
          </section>

          <main className="max-w-6xl mx-auto px-4 py-12 space-y-20">
            
            <section id="flavors" className="space-y-8">
              <div className="text-center space-y-3">
                <h2 className="text-4xl font-bold">Mūsu Garšas</h2>
                <p className="text-gray-600 max-w-xl mx-auto">Izvēlieties garšas un pievienojiet tās savai dāvanu kastei.</p>
              </div>
              
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {FLAVORS.map(flavor => {
                  const count = getItemCount(flavor.id);
                  return (
                    <div 
                      key={flavor.id} 
                      className={`p-6 rounded-2xl border ${flavor.color} transition-all hover:shadow-lg flex flex-col justify-between space-y-4 bg-white/80 backdrop-blur-sm`}
                    >
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <h3 className="text-xl font-bold">{flavor.name}</h3>
                          <span className={`w-4 h-4 rounded-full ${flavor.circleBg} border border-white shadow-sm`}></span>
                        </div>
                        <p className="text-sm opacity-90">{flavor.desc}</p>
                      </div>
                      <div className="flex justify-between items-center pt-2">
                        <span className="font-bold text-lg">{flavor.price.toFixed(2)} € / gab.</span>
                        
                        <div className="flex items-center gap-2">
                          {count > 0 && (
                            <button 
                              onClick={() => removeLastItemOfId(flavor.id)}
                              className="w-8 h-8 rounded-xl bg-white text-brand-dark font-bold flex items-center justify-center shadow-sm"
                            >
                              -
                            </button>
                          )}
                          {count > 0 && <span className="text-sm font-bold w-4 text-center">{count}</span>}
                          <button 
                            onClick={() => addItem(flavor)}
                            disabled={boxItems.length >= selectedBoxSize}
                            className="bg-brand-dark text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-brand-accent transition-all disabled:opacity-50"
                          >
                            + Pievienot
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            <section id="builder" className="bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-rose-100 space-y-8">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                  <h2 className="text-3xl font-bold">Kastītes Salicējs</h2>
                  <p className="text-gray-600 text-sm">Izvēlieties kastītes ietilpību un piepildiet to.</p>
                </div>

                <div className="flex bg-brand-pink p-1.5 rounded-2xl gap-2">
                  {BOX_SIZES.map(box => (
                    <button
                      key={box.size}
                      onClick={() => {
                        setSelectedBoxSize(box.size);
                        setBoxItems([]);
                      }}
                      className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${
                        selectedBoxSize === box.size 
                          ? 'bg-white shadow-sm text-brand-dark font-bold' 
                          : 'text-gray-600 hover:text-brand-dark'
                      }`}
                    >
                      {box.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="space-y-2">
                <div className="flex justify-between text-sm font-medium">
                  <span>Aizpildījums: {boxItems.length} no {selectedBoxSize} gab.</span>
                  <span>{boxItems.length === selectedBoxSize ? 'Kaste ir pilna! ✨' : `Varat pievienot vēl ${selectedBoxSize - boxItems.length} gab.`}</span>
                </div>
                <div className="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
                  <div 
                    className="bg-brand-accent h-full transition-all duration-300"
                    style={{ width: `${(boxItems.length / selectedBoxSize) * 100}%` }}
                  ></div>
                </div>
              </div>

              <div className="bg-brand-pink/40 p-6 md:p-8 rounded-2xl border border-rose-100">
                <h4 className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-4 text-center">Jūsu dāvanu kastes izkārtojums</h4>
                
                <div className={`grid ${currentBoxConfig.gridCols} gap-4 max-w-2xl mx-auto`}>
                  {Array.from({ length: selectedBoxSize }).map((_, index) => {
                    const item = boxItems[index];
                    return (
                      <div 
                        key={index}
                        className="aspect-square rounded-2xl border-2 border-dashed border-rose-200/80 bg-white/60 flex items-center justify-center relative group transition-all"
                      >
                        {item ? (
                          <div 
                            onClick={() => removeItemAtIndex(index)}
                            title={`Klikšķiniet, lai izņemtu ${item.name}`}
                            className={`w-4/5 h-4/5 rounded-full ${item.circleBg} shadow-md flex items-center justify-center cursor-pointer transform hover:scale-105 transition-all animate-pop-in relative border-2 border-white`}
                          >
                            <span className="text-[10px] font-bold text-brand-dark/70 opacity-0 group-hover:opacity-100 transition-opacity">✕</span>
                          </div>
                        ) : (
                          <span className="text-xs text-rose-300 font-light">{index + 1}</span>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </section>

            <section id="order" className="max-w-2xl mx-auto bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-rose-100 space-y-6">
              <div className="text-center space-y-2">
                <h2 className="text-3xl font-bold">Noformēt Pasūtījumu</h2>
                <p className="text-gray-600 text-sm">Aizpildiet informāciju saņemšanai.</p>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Vārds, Uzvārds</label>
                  <input 
                    type="text" 
                    required 
                    placeholder="Jānis Bērziņš"
                    value={formData.name}
                    onChange={e => setFormData({...formData, name: e.target.value})}
                    className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-accent transition-colors"
                  />
                </div>

                <div className="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Tālrunis</label>
                    <input 
                      type="tel" 
                      required 
                      placeholder="+371 20000000"
                      value={formData.phone}
                      onChange={e => setFormData({...formData, phone: e.target.value})}
                      className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-accent transition-colors"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">E-pasts</label>
                    <input 
                      type="email" 
                      required 
                      placeholder="janis@gmail.com"
                      value={formData.email}
                      onChange={e => setFormData({...formData, email: e.target.value})}
                      className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-accent transition-colors"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Saņemšanas datums</label>
                  <input 
                    type="date" 
                    required 
                    value={formData.date}
                    onChange={e => setFormData({...formData, date: e.target.value})}
                    className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-accent transition-colors text-gray-700"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Piezīmes</label>
                  <textarea 
                    rows="3" 
                    placeholder="Papildu vēlmes vai saņemšanas detaļas..."
                    value={formData.notes}
                    onChange={e => setFormData({...formData, notes: e.target.value})}
                    className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-accent transition-colors"
                  ></textarea>
                </div>

                <div className="pt-4 border-t border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                  <div>
                    <span className="text-xs text-gray-500 block">Kopējā summa (ar atlaidi):</span>
                    <span className="text-3xl font-bold text-brand-dark">{calculateTotal()} €</span>
                  </div>
                  <button 
                    type="submit"
                    className="w-full sm:w-auto bg-brand-dark text-white px-8 py-3.5 rounded-xl font-bold hover:bg-brand-accent transition-colors shadow-md"
                  >
                    Nosūtīt pasūtījumu
                  </button>
                </div>
              </form>
            </section>

          </main>

          {/* MODĀLIE LOGI */}
          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
              <div className="bg-white max-w-md w-full p-8 rounded-3xl shadow-2xl space-y-6 text-center transform animate-pop-in">
                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                  ✓
                </div>
                <div className="space-y-2">
                  <h3 className="text-3xl font-serif font-bold text-brand-dark">Paldies par pasūtījumu!</h3>
                  <p className="text-gray-600 text-sm">
                    Mēs esam saņēmuši Jūsu pasūtījumu. Drīzumā sazināsimies uz e-pastu <strong>{formData.email}</strong>, lai apstiprinātu saņemšanas laiku.
                  </p>
                </div>
                <button 
                  onClick={() => {
                    setShowModal(false);
                    setBoxItems([]);
                    setFormData({ name: '', phone: '', email: '', date: '', notes: '' });
                  }}
                  className="w-full bg-brand-dark text-white py-3.5 rounded-xl font-bold hover:bg-brand-accent transition-colors"
                >
                  Aizvērt un sākt no jauna
                </button>
              </div>
            </div>
          )}

          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
              <div className="bg-white max-w-sm w-full p-8 rounded-3xl shadow-2xl space-y-6 relative transform animate-pop-in">
                <button 
                  onClick={() => setShowLoginModal(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-lg font-bold"
                >
                  ✕
                </button>

                <div className="text-center space-y-1">
                  <h3 className="text-2xl font-serif font-bold text-brand-dark">Admin Piekļuve</h3>
                  <p className="text-xs text-gray-500">Ievadiet datus, lai pārietu uz admin.html</p>
                </div>

                {loginError && (
                  <div className="bg-rose-50 text-rose-600 text-xs p-3 rounded-xl border border-rose-200 text-center font-medium">
                    {loginError}
                  </div>
                )}

                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Lietotājvārds</label>
                    <input 
                      type="text" 
                      required 
                      value={loginUser}
                      onChange={e => setLoginUser(e.target.value)}
                      className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-accent text-sm"
                      placeholder="admin"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Parole</label>
                    <input 
                      type="password" 
                      required 
                      value={loginPass}
                      onChange={e => setLoginPass(e.target.value)}
                      className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-accent text-sm"
                      placeholder="••••••••"
                    />
                  </div>

                  <button 
                    type="submit"
                    className="w-full bg-brand-dark text-white py-3 rounded-xl font-bold text-sm hover:bg-brand-accent transition-colors shadow-sm"
                  >
                    Ieiet Admin Panelī
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('react-app'));
    root.render(<App />);
  </script>
</body>
</html>
